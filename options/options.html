<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FormSaver Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      min-width: 400px;
    }
    .option-group {
      margin-bottom: 20px;
    }
    .option-group h3 {
      margin-top: 0;
      color: #333;
    }
    .option-item {
      margin: 10px 0;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="checkbox"] {
      margin-right: 8px;
    }
    input[type="number"] {
      width: 60px;
      padding: 3px 5px;
    }
    button {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .success {
      background-color: #dff0d8;
      color: #3c763d;
    }
    .error {
      background-color: #f2dede;
      color: #a94442;
    }
  </style>
</head>
<body>
  <h2>FormSaver 设置</h2>
  
  <div class="option-group">
    <h3>保存设置</h3>
    <div class="option-item">
      <label>
        <input type="checkbox" id="autoSaveEnabled"> 启用自动保存
      </label>
      <small>在表单发生变化时自动保存</small>
    </div>
    <div class="option-item">
      <label>
        <input type="checkbox" id="excludePasswords"> 排除密码字段
      </label>
      <small>不保存密码类型的输入框（推荐开启）</small>
    </div>
    <div class="option-item">
      <label>
        <input type="checkbox" id="saveHiddenFields"> 保存隐藏字段
      </label>
      <small>保存页面上不可见的表单字段</small>
    </div>
  </div>
  
  <div class="option-group">
    <h3>通知设置</h3>
    <div class="option-item">
      <label>
        <input type="checkbox" id="showNotifications"> 显示通知
      </label>
      <small>在保存或恢复表单时显示桌面通知</small>
    </div>
    <div class="option-item">
      <label>
        保存后通知停留时间: 
        <input type="number" id="notificationTimeout" min="1" max="10" value="5"> 秒
      </label>
    </div>
  </div>
  
  <div class="option-group">
    <h3>数据管理</h3>
    <div class="option-item">
      <button id="clearAllData">清除所有保存的数据</button>
      <small>警告：此操作无法撤销</small>
    </div>
    <div class="option-item">
      <button id="exportData">导出保存的数据</button>
      <small>将保存的表单数据导出为JSON文件</small>
    </div>
    <div class="option-item">
      <button id="importData">导入数据</button>
      <small>从JSON文件导入表单数据</small>
    </div>
  </div>
  
  <button id="saveOptions">保存设置</button>
  <div id="status" class="status"></div>
  
  <script src="options.js"></script>
</body>
</html>
